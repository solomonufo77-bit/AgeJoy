name: AgeJoy Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout AgeJoy
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Capacitor Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Configure Android for Google Play
        run: node scripts/configure-android.mjs

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Switch to Java 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify unwanted permissions
        working-directory: android
        run: |
          if grep -R -E 'SYSTEM_ALERT_WINDOW|READ_PHONE_STATE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|BLUETOOTH|BLUETOOTH_ADMIN|BLUETOOTH_CONNECT|BLUETOOTH_SCAN|NFC|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE|NEARBY_WIFI_DEVICES' app/src/main/AndroidManifest.xml; then
            echo "Unwanted permission found"
            exit 1
          fi

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: agejoy-android-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
