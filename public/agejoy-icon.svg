<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063F22"/>
      <stop offset="0.45" stop-color="#00652F"/>
      <stop offset="1" stop-color="#003A20"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9FF9A"/>
      <stop offset="0.45" stop-color="#9DFF3F"/>
      <stop offset="1" stop-color="#00D85A"/>
    </linearGradient>

    <linearGradient id="joy" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#E8FF9B"/>
      <stop offset="0.5" stop-color="#9DFF43"/>
      <stop offset="1" stop-color="#00D95C"/>
    </linearGradient>

    <radialGradient id="shine" cx="20%" cy="15%" r="80%">
      <stop offset="0" stop-color="#8CFF9B" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#24C85F" stop-opacity=".18"/>
      <stop offset="1" stop-color="#003A20" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="14"
        flood-color="#001F10" flood-opacity=".65"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="18" y="18" width="988" height="988" rx="150"
        fill="url(#bg)"/>

  <!-- Gloss -->
  <rect x="18" y="18" width="988" height="988" rx="150"
        fill="url(#shine)"/>

  <!-- Outer glossy border -->
  <rect x="25" y="25" width="974" height="974" rx="143"
        fill="none"
        stroke="#9CFF72"
        stroke-width="8"
        opacity=".9"/>

  <rect x="42" y="42" width="940" height="940" rx="130"
        fill="none"
        stroke="#063A20"
        stroke-width="14"
        opacity=".8"/>

  <!-- Sparkle -->
  <path d="M512 125
           C535 190 555 214 620 238
           C555 261 535 285 512 350
           C489 285 469 261 404 238
           C469 214 489 190 512 125Z"
        fill="#FFFFFF"
        filter="url(#shadow)"/>

  <!-- Large plus -->
  <rect x="675" y="108" width="62" height="178" rx="31"
        fill="url(#green)" filter="url(#shadow)"/>
  <rect x="617" y="166" width="178" height="62" rx="31"
        fill="url(#green)" filter="url(#shadow)"/>

  <!-- Small plus -->
  <rect x="260" y="350" width="34" height="112" rx="17"
        fill="url(#green)"/>
  <rect x="221" y="389" width="112" height="34" rx="17"
        fill="url(#green)"/>

  <!-- Small sparkle -->
  <path d="M748 329
           C762 369 777 384 817 398
           C777 412 762 427 748 467
           C734 427 719 412 679 398
           C719 384 734 369 748 329Z"
        fill="url(#green)"
        filter="url(#shadow)"/>

  <!-- AgeJoy text -->
  <text x="512" y="610"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="178"
        font-weight="800"
        letter-spacing="-10"
        fill="#FFFFFF"
        filter="url(#shadow)">Age</text>

  <text x="690" y="610"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="178"
        font-weight="800"
        letter-spacing="-10"
        fill="url(#joy)"
        filter="url(#shadow)">Joy</text>

  <!-- Tagline -->
  <text x="512" y="690"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="45"
        font-weight="700"
        fill="#FFFFFF">Age, wishes &amp;</text>

  <text x="512" y="742"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="45"
        font-weight="700"
        fill="#FFFFFF">daily inspiration</text>

  <!-- Smile -->
  <path d="M350 800 Q512 900 674 800"
        fill="none"
        stroke="url(#green)"
        stroke-width="22"
        stroke-linecap="round"
        filter="url(#shadow)"/>

  <!-- Bottom waves -->
  <path d="M18 785
           Q210 930 420 870
           Q690 790 1006 690
           L1006 1006
           L18 1006Z"
        fill="#007C3D"
        opacity=".85"/>

  <path d="M18 850
           Q230 990 460 900
           Q730 800 1006 735
           L1006 1006
           L18 1006Z"
        fill="url(#green)"
        opacity=".85"/>

  <path d="M18 920
           Q250 1010 500 925
           Q760 835 1006 780
           L1006 1006
           L18 1006Z"
        fill="#008B48"
        opacity=".9"/>

  <!-- Final inner highlight -->
  <rect x="35" y="35" width="954" height="954" rx="138"
        fill="none"
        stroke="#B8FF8A"
        stroke-width="3"
        opacity=".55"/>
</svg>
